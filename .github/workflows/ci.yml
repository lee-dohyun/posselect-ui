name: CI

# posselect-ui는 ui.posselect.com(디자인 시스템 갤러리)으로 실제 배포되는 정적 사이트다.
# main push 시 타입체크 + site/index.html을 nginx:alpine에 담아 Docker Hub로 push,
# 이 서버의 self-hosted runner가 K3s posselect-ui Deployment에 자동 반영한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save typescript@^5 @types/react@^18 react@^18
      - run: npx tsc --noEmit

  build:
    needs: typecheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]
    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            set image deployment/posselect-ui posselect-ui=leedohyun1985/posselect-ui:${{ github.sha }} -n default

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            rollout status deployment/posselect-ui -n default --timeout=120s
