name: CI

# posselect-ui는 ui.posselect.com(디자인 시스템 문서 사이트)으로 실제 배포된다.
# main push 시 타입체크 + Storybook 정적 빌드를 nginx:alpine에 담아 Docker Hub로 push,
# 이 서버의 self-hosted runner가 K3s posselect-ui Deployment에 자동 반영한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # devDependencies에 typescript/@types/react/react가 선언돼 있으므로 예전처럼
      # --no-save로 따로 끌어오지 않는다(선언된 버전과 CI가 쓰는 버전이 갈라지던 문제).
      - run: npm install
      - run: npm run typecheck

  # 모든 스토리를 실제 브라우저(chromium)에서 렌더링하고 play 인터랙션을 실행한다(gateway#208).
  # 예전에는 play 함수가 어디에서도 실행되지 않았다. PR 과 main push 양쪽에서 돌고, 실패하면
  # 아래 build(문서 사이트 배포)가 돌지 않는다. main 직push 가 흔한 저장소라 PR 전용으로 두지 않았다.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories

  build:
    needs: [typecheck, stories]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:${{ github.sha }}

      # DevSecOps SCA rollout (architecture#15 / architecture#17): scan the image we just
      # built/pushed for known OS + npm vulnerabilities. Report-only for now —
      # TODO: once findings are triaged, set exit-code: '1' with
      # severity: 'CRITICAL,HIGH' to actually gate the build/deploy.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]
    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            set image deployment/posselect-ui posselect-ui=leedohyun1985/posselect-ui:${{ github.sha }} -n default

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            rollout status deployment/posselect-ui -n default --timeout=300s
