name: CI

# posselect-ui는 ui.posselect.com(디자인 시스템 문서 사이트)으로 실제 배포된다.
# main push 시 타입체크 + Storybook 정적 빌드를 nginx:alpine에 담아 Docker Hub로 push,
# 이 서버의 self-hosted runner가 K3s posselect-ui Deployment에 자동 반영한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # devDependencies에 typescript/@types/react/react가 선언돼 있으므로 예전처럼
      # --no-save로 따로 끌어오지 않는다(선언된 버전과 CI가 쓰는 버전이 갈라지던 문제).
      - run: npm ci
      - run: npm run typecheck
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Test Storybook
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npm run storybook -- --no-open --port 6006" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test-storybook"

  build:
    needs: typecheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/posselect-ui:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]
    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            set image deployment/posselect-ui posselect-ui=leedohyun1985/posselect-ui:${{ github.sha }} -n default

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/posselect-ui-deployer.kubeconfig \
            rollout status deployment/posselect-ui -n default --timeout=300s
