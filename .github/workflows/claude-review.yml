# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 공통 디자인 시스템이며 소비 저장소 5곳이 소스째 가져다 쓴다.
            
            우선 확인할 것:
            1. src/styles/tokens.css 와 tailwind.config.js 는 서로의 미러다. 한쪽만 바뀌지 않았는가.
            2. 정의되지 않은 CSS 변수 참조가 없는가 — 조용히 죽어 배경이 투명해진다(hero 배너 인시던트).
            3. 새 컴포넌트라면 src/index.ts 배럴 export 와 src/stories/ 스토리가 함께 있는가. 둘 중 하나라도
               빠지면 공개 API 에 없거나 문서 사이트에서 보이지 않는다.
            4. 디자인 규칙: accent(#234e95)는 버튼/링크/active 전용, highlight(코랄)는 강조 전용으로 버튼/크롬에 쓰지 않는다.
               라운드는 0. Barlow 는 한글 글리프가 없어 폰트 스택의 Pretendard 폴백이 빠지면 한글이 깨진다.
            5. CI 는 이 저장소의 Storybook 문서 사이트만 배포한다 — 소비 저장소 5곳 재빌드가 필요한 변경인지 언급할 것.
            
            확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
