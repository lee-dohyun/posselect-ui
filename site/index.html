20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8027fabd-4730-427b-a9ad-b5e13d5bf962\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"738c34f1-04ec-44b1-9049-d81bb68c654c\"><\u002Fscript>\n<script src=\"64a29e24-3236-45c7-9168-7ddb391e7a31\"><\u002Fscript>\n<style>\n  body{margin:0}\n  a{color:var(--color-accent)}\n  a:hover{color:var(--color-accent-700)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);\n--color-accent:#234e95;--color-accent-100:#ecf1f8;--color-accent-200:#d2ddee;--color-accent-300:#adc0e1;--color-accent-400:#7d9bcf;--color-accent-500:#4c77bd;--color-accent-600:#33558B;--color-accent-700:#28416c;--color-accent-800:#1d2f4e;--color-accent-900:#132034;\n--color-accent-2-100:#ecf1f8;--color-accent-2-200:#d2ddee;--color-accent-2-300:#adc0e1;--color-accent-2-400:#7d9bcf;--color-accent-2-500:#4c77bd;--color-accent-2-600:#33558B;--color-accent-2-700:#28416c;--color-accent-2-800:#1d2f4e;--color-accent-2-900:#132034;\n--color-success:#6f9b7e;--color-success-bg:#e9f1ec;--color-warning:#c9a35f;--color-warning-bg:#f6efe0;--color-danger:#b06a63;--color-danger-bg:#f5e8e6;\n--color-highlight:#d1553c;--color-highlight-100:#faedea;--color-highlight-200:#f3d4cd;--color-highlight-300:#eab0a4;--color-highlight-400:#dd816f;--color-highlight-500:#d46149;--color-highlight-600:#d1553c;--color-highlight-700:#993824;--color-highlight-800:#6f291a;--color-highlight-900:#4a1b12;\">\n\n  <nav style=\"width:232px;flex:none;border-right:1px solid var(--color-divider);padding:24px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:22px\">\n    <div style=\"padding:0 10px 6px;display:flex;align-items:center;gap:10px\">\n      <img src=\"https://image.posselect.com/1fpt6idOY3wT6OjMJUKjgL8FVfnyuWLE_acWKMVtlnE/rs:fit:0:0/plain/s3://design-assets/brand/favicon-256.png\" style=\"width:30px;height:30px;flex:none\">\n      <div>\n        <div style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:-0.01em\">PosSelect<\u002Fdiv>\n        <div style=\"font-size:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent);margin-top:2px\">Design System<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ navGroups }}\" as=\"group\" hint-placeholder-count=\"4\">\n      <div>\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 45%, transparent);padding:0 10px;margin-bottom:6px\">{{ group.title }}<\u002Fdiv>\n        <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"3\">\n          <div style=\"{{ item.style }}\" sc-camel-on-click=\"{{ item.onClick }}\">{{ item.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <main style=\"flex:1;overflow-y:auto;padding:40px 56px 120px\">\n\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:760px\">\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:10px\">Overview<\u002Fdiv>\n        <img src=\"a35dcf49-8f89-4da0-996b-ea1402549991\" style=\"max-width:340px;width:100%;margin-bottom:24px\">\n\n        <h3 style=\"margin-top:0\">활용 예시<\u002Fh3>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px\">\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:220px\">\n            <img src=\"5d962525-c927-45de-a21b-c831e65dddf5\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">모노(블랙) — 인쇄/단색 적용<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:220px;background:#132034\">\n            <img src=\"eeb24564-e1da-4d71-9395-e4943be2bbb4\" style=\"width:100%\">\n            <div style=\"font-size:11px;color:rgba(242,242,243,0.6);margin-top:8px\">다크 배경용<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:160px\">\n            <img src=\"d1c1c620-153e-4c73-94a5-05f37527444a\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">줄바꿈(스택형)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:260px\">\n            <img src=\"cc67f2a0-be9d-4a5a-a87e-8a7262529584\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">줄바꿈 + Positive 풀네임(연한 톤)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:260px\">\n            <img src=\"https://image.posselect.com/ph9MuvwqC4W2OLiZh1PuukrhkL8NmUuc-lvNLn-Aq8c/rs:fit:0:0/plain/s3://design-assets/brand/posselect-logo-with-subtitle.png\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">태그라인 — Positively Selected for You<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:260px\">\n            <img src=\"faf9551b-4e02-4c3b-962d-dd0121f05ac4\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">태그라인 — 당신을 위한 좋은 선택(한글)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:180px\">\n            <img src=\"https://image.posselect.com/SfAcV2zSf5tAbK25kHnyViDTvn9JtwYNK6HrRA8FoGU/rs:fit:0:0/plain/s3://design-assets/brand/posselect-logo-square.png\" style=\"width:100%\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">정방형 — 프로필/아이콘용<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:130px\">\n            <img src=\"https://image.posselect.com/1fpt6idOY3wT6OjMJUKjgL8FVfnyuWLE_acWKMVtlnE/rs:fit:0:0/plain/s3://design-assets/brand/favicon-256.png\" style=\"width:64px;height:64px\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">파비콘 — 블루 배경 + 코랄 P (확정)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:130px;background:repeating-conic-gradient(#e5e5e6 0% 25%, #f2f2f3 0% 50%) 50% / 12px 12px\">\n            <img src=\"https://image.posselect.com/AEbG8QDey_kyF_wpSMK8ZS6K5Lv8pdBtunkNPp_v1Wo/rs:fit:0:0/plain/s3://design-assets/brand/favicon-transparent-256.png\" style=\"width:64px;height:64px\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">파비콘 — 투명 배경 + 블루 P<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:16px;width:130px;background:repeating-conic-gradient(#e5e5e6 0% 25%, #f2f2f3 0% 50%) 50% / 12px 12px\">\n            <img src=\"https://image.posselect.com/Ro2sN_Wrzw13wVkazPoD9p7CixpHgTIbbwVnylxIgEI/rs:fit:0:0/plain/s3://design-assets/brand/favicon-transparent-red-256.png\" style=\"width:64px;height:64px\">\n            <div style=\"font-size:11px;opacity:0.6;margin-top:8px\">파비콘 — 투명 배경 + 레드(코랄) P<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h1 style=\"margin:0 0 16px\">PosSelect 디자인 시스템<\u002Fh1>\n        <p style=\"font-size:15px;line-height:1.7;opacity:0.85\">customer.front · product.front · admin.front · home.front, 4개 프론트엔드 서비스가 공통으로 참조하는 파운데이션과 핵심 UI 컴포넌트입니다. \"쇼핑몰이지만 신뢰감 있고 안전하다\"는 톤을 격자形 레이아웃, 얇은 선, 등록마크 프레임으로 표현합니다.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--color-divider);margin-top:32px;border:1px solid var(--color-divider)\">\n          <div style=\"background:var(--color-bg);padding:20px\">\n            <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:600\">4<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:0.7;margin-top:4px\">참조 서비스<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-bg);padding:20px\">\n            <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:600\">Barlow<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:0.7;margin-top:4px\">Condensed / Regular<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--color-bg);padding:20px\">\n            <div style=\"font-family:var(--font-heading);font-size:26px;font-weight:600\">#5980a6<\u002Fdiv>\n            <div style=\"font-size:12px;opacity:0.7;margin-top:4px\">accent (steel blue)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin-top:40px\">사용 방법<\u002Fh3>\n        <p style=\"font-size:14px;opacity:0.8;line-height:1.7\">각 서비스에서 <code style=\"background:var(--color-surface);padding:2px 6px;font-size:13px\">styles.css<\u002Fcode>를 링크하고, 아래 토큰(<code style=\"background:var(--color-surface);padding:2px 6px;font-size:13px\">var(--*)<\u002Fcode>)과 클래스를 그대로 사용하세요. 컴포넌트는 순수 CSS 클래스로 동작하며 별도 빌드가 필요 없습니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isColors }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:900px\">\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:10px\">Foundations<\u002Fdiv>\n        <h1>컬러<\u002Fh1>\n        <p style=\"font-size:14px;opacity:0.75;margin-bottom:28px\">단일 accent(steel blue) 기반 모노 팔레트. Success/Warning/Danger는 이커머스 상태 표시를 위해 새로 추가한 시맨틱 컬러입니다.<\u002Fp>\n\n        <h4>Core<\u002Fh4>\n        <div style=\"display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap\">\n          <sc-for list=\"{{ coreColors }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"width:150px\">\n              <div style=\"height:72px;background:{{ c.hex }};border:1px solid var(--color-divider)\"><\u002Fdiv>\n              <div style=\"font-size:12px;margin-top:6px;font-weight:500\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-family:ui-monospace,monospace;opacity:0.6\">{{ c.var }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-family:ui-monospace,monospace;opacity:0.6\">{{ c.hex }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h4>Accent ramp<\u002Fh4>\n        <div style=\"display:flex;margin-bottom:32px;border:1px solid var(--color-divider)\">\n          <sc-for list=\"{{ accentRamp }}\" as=\"c\" hint-placeholder-count=\"9\">\n            <div style=\"flex:1;padding:10px 8px;background:{{ c.hex }};color:{{ c.fg }}\">\n              <div style=\"font-size:11px;font-weight:600\">{{ c.step }}<\u002Fdiv>\n              <div style=\"font-size:9px;font-family:ui-monospace,monospace;margin-top:22px\">{{ c.hex }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h4>Neutral ramp<\u002Fh4>\n        <div style=\"display:flex;margin-bottom:32px;border:1px solid var(--color-divider)\">\n          <sc-for list=\"{{ neutralRamp }}\" as=\"c\" hint-placeholder-count=\"9\">\n            <div style=\"flex:1;padding:10px 8px;background:{{ c.hex }};color:{{ c.fg }}\">\n              <div style=\"font-size:11px;font-weight:600\">{{ c.step }}<\u002Fdiv>\n              <div style=\"font-size:9px;font-family:ui-monospace,monospace;margin-top:22px\">{{ c.hex }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h4>Semantic<\u002Fh4>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px\">\n          <sc-for list=\"{{ semanticColors }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"width:210px;border:1px solid var(--color-divider);padding:14px;background:{{ c.bgVar }}\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"width:14px;height:14px;background:{{ c.fgVar }}\"><\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;font-family:ui-monospace,monospace;opacity:0.65;margin-top:8px\">{{ c.varName }}<\u002Fdiv>\n              <div style=\"font-size:12px;margin-top:6px;opacity:0.75\">{{ c.usage }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h4>Highlight — 코랄/버밀리언<\u002Fh4>\n        <p style=\"font-size:13px;opacity:0.7;margin:-8px 0 12px\">할인가, 쿠폰 등 실제 혜택 신호를 강조하는 색. 재고·배송 같은 상태 표시(warning/danger)와는 분리해, 로고와 혜택 배지 같은 포인트 강조에만 사용합니다. 버튼이나 기본 내비게이션 등 상시 UI에는 쓰지 않습니다.<\u002Fp>\n        <div style=\"display:flex;border:1px solid var(--color-divider)\">\n          <sc-for list=\"{{ highlightRamp }}\" as=\"c\" hint-placeholder-count=\"9\">\n            <div style=\"flex:1;padding:10px 8px;background:{{ c.hex }};color:{{ c.fg }}\">\n              <div style=\"font-size:11px;font-weight:600\">{{ c.step }}<\u002Fdiv>\n              <div style=\"font-size:9px;font-family:ui-monospace,monospace;margin-top:22px\">{{ c.hex }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isType }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:760px\">\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:10px\">Foundations<\u002Fdiv>\n        <h1>타이포그래피<\u002Fh1>\n        <p style=\"font-size:14px;opacity:0.75;margin-bottom:28px\">헤딩 — Barlow Condensed 600 · 본문 — Barlow 400<\u002Fp>\n        <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;align-items:baseline;gap:24px;padding:14px 0;border-bottom:1px solid var(--color-divider)\">\n            <div style=\"width:130px;flex:none;font-size: 002Fdiv>\n          <div style=\"text-align:center;border:1px solid var(--color-divider);padding:16px 8px\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:var(--color-text)\"><rect x=\"2\" y=\"7\" width=\"12\" height=\"9\"><\u002Frect><path d=\"M14 10h4l3 3v3h-7\"><\u002Fpath><circle cx=\"6.5\" cy=\"18\" r=\"1.6\"><\u002Fcircle><circle cx=\"17.5\" cy=\"18\" r=\"1.6\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"font-size:10px;opacity:0.6;margin-top:8px\">truck<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;border:1px solid var(--color-divider);padding:16px 8px\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:var(--color-text)\"><path d=\"M12 3l8 8-9 9-8-8V4h8z\"><\u002Fpath><circle cx=\"8\" cy=\"8\" r=\"1.2\"><\u002Fcircle><\u002Fsvg>\n            <div style=\"font-size:10px;opacity:0.6;margin-top:8px\">tag<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;opacity:0.7;margin-top:20px\">쇼핑몰 공통 아이콘(장바구니·검색·찜·계정·배송·태그) 예시. 실제 구현 시 <code style=\"background:var(--color-surface);padding:1px 5px\">lucide-react<\u002Fcode> 패키지를 그대로 사용하세요.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResponsive }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:760px\">\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:10px\">Foundations<\u002Fdiv>\n        <h1>반응형<\u002Fh1>\n        <p style=\"font-size:14px;opacity:0.75;margin-bottom:28px\">4개 서비스 모두 데스크톱과 모바일을 함께 지원합니다. 브레이크포인트 기준과 터치 타깃 최소 크기입니다.<\u002Fp>\n        <sc-raw-table class=\"table\" style=\"margin-bottom:28px\">\n          <sc m:16px;align-items:center\">\n          <div class=\"seg\">\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"admfilter\" sc-camel-default-checked=\"\">전체<\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"admfilter\">처리중<\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"admfilter\">완료<\u002Flabel>\n          <\u002Fdiv>\n          <input class=\"input\" placeholder=\"주문번호 검색\" style=\"max-width:220px\">\n        <\u002Fdiv>\n        <sc-raw-table class=\"table\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>주문번호<\u002Fsc-raw-th><sc-raw-th>상품<\u002Fsc-raw-th><sc-raw-th>금액<\u002Fsc-raw-th><sc-raw-th>상태<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ orderRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <sc-raw-tr>\n                <sc-raw-td>{{ r.id }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ r.product }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ r.amount }}<\u002Fsc-raw-td>\n                <sc-raw-td><span class=\"tag\" style=\"{{ r.tagStyle }}\">{{ r.status }}<\u002Fspan><\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { activeId: 'overview', dialogOpen: false, toastVisible: false };\n\n  setActive(id) { this.setState({ activeId: id }); }\n  openDialog() { this.setState({ dialogOpen: true }); }\n  closeDialog() { this.setState({ dialogOpen: false }); }\n  showToast() {\n    this.setState({ toastVisible: true });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toastVisible: false }), 2500);\n  }\n\n  navStyle(id, active) {\n    return {\n      padding: '8px 10px',\n      fontSize: '13px',\n      cursor: 'pointer',\n      background: active ? 'var(--color-accent)' : 'transparent',\n      color: active ? 'var(--color-bg)' : 'var(--color-text)'\n    };\n  }\n\n  renderVals() {\n    const active = this.state.activeId;\n    const rawGroups = [\n      { title: '개요', items: [{ id: 'overview', label: '개요' }] },\n      { title: '파운데이션', items: [\n        { id: 'colors', label: '컬러' },\n        { id: 'type', label: '타이포그래피' },\n        { id: 'spacing', label: '스페이싱' },\n        { id: 'icons', label: '아이콘' },\n        { id: 'responsive', label: '반응형' },\n        { id: 'accessibility', label: '접근성' }\n      ] },\n      { title: '컴포넌트', items: [\n        { id: 'buttons', label: '버튼' },\n        { id: 'forms', label: '폼' },\n        { id: 'cards', label: '카드' },\n        { id: 'tags', label: '태그/배지' },\n        { id: 'nav', label: '내비게이션' },\n        { id: 'table', label: '테이블' },\n        { id: 'dialog', label: '다이얼로그/토스트' },\n        { id: 'pagination', label: '페이지네이션' },\n        { id: 'timeline', label: '배송 타임라인' },\n        { id: 'gallery', label: '이미지 갤러리' },\n        { id: 'empty-state', label: '빈 상태' },\n        { id: 'skeleton', label: '로딩 스켈레톤' }\n      ] },\n      { title: '샘플 화면', items: [\n        { id: 'product-list', label: '상품 리스트' },\n        { id: 'checkout', label: '로그인' },\n        { id: 'admin', label: '주문 관리(admin)' }\n      ] }\n    ];\n    const navGroups = rawGroups.map(g => ({\n      title: g.title,\n      items: g.items.map(it => ({\n        id: it.id,\n        label: it.label,\n        style: this.navStyle(it.id, active === it.id),\n        onClick: () => this.setActive(it.id)\n      }))\n    }));\n\n    const coreColors = [\n      { name: 'Background', var: '--color-bg', hex: '#f2f2f3' },\n      { name: 'Surface', var: '--color-surface', hex: '#e9e9ea' },\n      { name: 'Text', var: '--color-text', hex: '#1d1f20' },\n      { name: 'Accent', var: '--color-accent', hex: '#234e95' }\n    ];\n    const accentHex = ['#eef6ff','#d6ebff','#b5d9fd','#94bce3','#749dc4','#597ea3','#416180','#2c455d','#1d2d3d'];\n    const neutralHex = ['#f5f5f8','#e7e7ea','#d4d4d7','#b7b7ba','#98989b','#7a7a7d','#5d5d60','#424244','#2b2b2d'];\n    const steps = [100,200,300,400,500,600,700,800,900];\n    const accentRamp = steps.map((s,i)=>({ step:s, hex:accentHex[i], fg: i>4 ? '#f2f2f3' : '#1d1f20' }));\n    const neutralRamp = steps.map((s,i)=>({ step:s, hex:neutralHex[i], fg: i>4 ? '#f5f5f8' : '#1d1f20' }));\n    const highlightHex = ['#faedea','#f3d4cd','#eab0a4','#dd816f','#d46149','#d1553c','#993824','#6f291a','#4a1b12'];\n    const highlightRamp = steps.map((s,i)=>({ step:s, hex:highlightHex[i], fg: i>3 ? '#faedea' : '#1d1f20' }));\n    const semanticColors = [\n      { name: 'Success', varName: '--color-success', fgVar: 'var(--color-success)', bgVar: 'var(--color-success-bg)', usage: '배송완료, 결제완료' },\n      { name: 'Warning', varName: '--color-warning', fgVar: 'var(--color-warning)', bgVar: 'var(--color-warning-bg)', usage: '재고부족, 임박 알림' },\n      { name: 'Danger', varName: '--color-danger', fgVar: 'var(--color-danger)', bgVar: 'var(--color-danger-bg)', usage: '품절, 주문 실패, 에러' }\n    ];\n\n    const typeScale = [\n      { tag: 'h1', size: '42px', sample: '무선 이어폰 Pro', style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '42px', lineHeight: 1.12 } },\n      { tag: 'h2', size: '32px', sample: '이번 주 추천 상품', style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '32px', lineHeight: 1.12 } },\n      { tag: 'h3', size: '25px', sample: '주문 내역', style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '25px', lineHeight: 1.12 } },\n      { tag: 'h4', size: '20px', sample: '배송 정보', style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '20px', lineHeight: 1.12 } },\n      { tag: 'body', size: '15px', sample: '주문이 정상적으로 접수되었습니다.', style: { fontFamily: 'var(--font-body)', fontSize: '15px', lineHeight: 1.55 } },\n      { tag: 'small', size: '13px', sample: '무료배송 · 오늘 출발', style: { fontFamily: 'var(--font-body)', fontSize: '13px', opacity: 0.75 } },\n      { tag: 'label', size: '11px', sample: 'SALE', style: { fontFamily: 'var(--font-body)', fontSize: '11px', letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--color-accent)' } }\n    ];\n\n    const spaceTokens = [\n      { var: '--space-1', px: '3.4px', label: '아이콘 간격' },\n      { var: '--space-2', px: '6.8px', label: '라벨-필드 간격' },\n      { var: '--space-3', px: '10.2px', label: '카드 내부 패딩' },\n      { var: '--space-4', px: '13.6px', label: '섹션 내부 패딩' },\n      { var: '--space-6', px: '20.4px', label: '카드 그리드 gap' },\n      { var: '--space-8', px: '27.2px', label: '섹션 간 여백' }\n    ];\n\n    const statusStyle = (kind) => {\n      const map = {\n        success: { background: 'var(--color-success-bg)', color: 'var(--color-success)' },\n        warning: { background: 'var(--color-warning-bg)', color: 'var(--color-warning)' },\n        danger: { background: 'var(--color-danger-bg)', color: 'var(--color-danger)' }\n      };\n      return map[kind];\n    };\n    const orderRows = [\n      { id: '#A-10231', product: '무선 이어폰 Pro', amount: '₩189,000', status: '배송완료', tagStyle: statusStyle('success') },\n      { id: '#A-10232', product: '스테인리스 텀블러', amount: '₩24,900', status: '결제대기', tagStyle: statusStyle('warning') },\n      { id: '#A-10233', product: '차량용 공기청정기', amount: '₩58,000', status: '주문취소', tagStyle: statusStyle('danger') }\n    ];\n\n    const timelineSteps = [\n      { label: '주문 완료', time: '8/2 14:20', dotStyle: 'width:12px;height:12px;background:var(--color-accent)', textStyle: '', showLine: true },\n      { label: '상품 준비중', time: '8/2 16:40', dotStyle: 'width:12px;height:12px;background:var(--color-accent)', textStyle: '', showLine: true },\n      { label: '배송중', time: '8/3 09:10', dotStyle: 'width:12px;height:12px;border:2px solid var(--color-accent);background:var(--color-bg)', textStyle: '', showLine: true },\n      { label: '배송완료', time: '예정 8/4', dotStyle: 'width:12px;height:12px;border:2px solid var(--color-divider);background:var(--color-bg)', textStyle: 'opacity:0.5', showLine: false }\n    ];\n    const galleryThumbs = [0,1,2,3,4].map(i => ({ id: 'thumb-'+i, style: i===0 ? 'outline:2px solid var(--color-accent);outline-offset:-1px' : '' }));\n    const skeletonCards = [0,1,2];\n\n    const products = [\n      { slotId: 'p1', name: '무선 이어폰 Pro', price: '₩189,000', discount: '12% 할인', tagLabel: '신상품', tagStyle: { background: 'var(--color-accent-100)', color: 'var(--color-accent-800)' } },\n      { slotId: 'p2', name: '스테인리스 텀블러', price: '₩24,900', tagLabel: '베스트', tagStyle: { background: 'var(--color-accent-100)', color: 'var(--color-accent-800)' } },\n      { slotId: 'p3', name: '차량용 공기청정기', price: '₩58,000', tagLabel: '품절', tagStyle: statusStyle('danger') }\n    ];\n\n    return {\n      navGroups, coreColors, accentRamp, neutralRamp, highlightRamp, semanticColors, typeScale, spaceTokens, orderRows, products, timelineSteps, galleryThumbs, skeletonCards,\n      dialogOpen: this.state.dialogOpen,\n      toastVisible: this.state.toastVisible,\n      openDialog: () => this.openDialog(),\n      closeDialog: () => this.closeDialog(),\n      showToast: () => this.showToast(),\n      isOverview: active === 'overview',\n      isColors: active === 'colors',\n      isType: active === 'type',\n      isSpacing: active === 'spacing',\n      isButtons: active === 'buttons',\n      isForms: active === 'forms',\n      isCards: active === 'cards',\n      isTags: active === 'tags',\n      isNav: active === 'nav',\n      isTable: active === 'table',\n      isDialog: active === 'dialog',\n      isProductList: active === 'product-list',\n      isCheckout: active === 'checkout',\n      isAdmin: active === 'admin',\n      isPagination: active === 'pagination',\n      isTimeline: active === 'timeline',\n      isGallery: active === 'gallery',\n      isEmptyState: active === 'empty-state',\n      isSkeleton: active === 'skeleton',\n      isResponsive: active === 'responsive',\n      isIcons: active === 'icons',\n      isAccessibility: active === 'accessibility'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}\n#__claude_design_branding a:hover span{text-decoration:underline}\n#__claude_design_branding svg{flex:none}\n#__claude_design_branding a svg{color:#D97757}\n#__claude_design_branding button{width:20px;height:20px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:currentColor;opacity:.55;border:0;background:none;cursor:pointer;flex:none;font:inherit;transition:opacity .14s}\n#__claude_design_branding button:hover{opacity:1;background:rgba(127,127,127,.22)}\n@media print{#__claude_design_branding{display:none}}<\u002Fstyle><a href=\"https://claude.com/product/design\" target=\"_blank\" rel=\"noopener noreferrer\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 20 21\" fill=\"none\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M9.99902 0C15.5258 0.000170936 19.999 4.50643 19.999 10.0547C19.999 11.7656 19.5863 12.9976 18.7861 13.8203C17.9924 14.6362 16.9465 14.9138 15.9854 15.0078C15.05 15.0993 14.0097 15.0262 13.2549 15.0186C12.8524 15.0145 12.5177 15.0267 12.2441 15.0703C11.9682 15.1144 11.8143 15.1813 11.7305 15.2432C1
